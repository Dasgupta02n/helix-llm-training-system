# Production stack for Hostinger VPS Docker Manager
# App clones from GitHub at start so no local build context is required.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: helix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helix_change_me}
      POSTGRES_DB: helix
    volumes:
      - helix_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helix -d helix"]
      interval: 5s
      timeout: 5s
      retries: 30

  app:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /app
    command:
      - bash
      - -lc
      - |
        set -e
        apt-get update -y
        apt-get install -y --no-install-recommends build-essential libpq-dev curl ca-certificates tar
        rm -rf /tmp/helix-src /tmp/helix.tgz
        curl -fsSL https://codeload.github.com/Dasgupta02n/helix-llm-training-system/tar.gz/refs/heads/main -o /tmp/helix.tgz
        mkdir -p /tmp/helix-src
        tar -xzf /tmp/helix.tgz -C /tmp/helix-src --strip-components=1
        find /app -mindepth 1 -maxdepth 1 ! -name data -exec rm -rf {} +
        cp -a /tmp/helix-src/. /app/
        pip install --no-cache-dir -r requirements.txt
        # Single worker: avoids multi-process bootstrap races + duplicate job workers
        exec uvicorn helix.api.main:app --host 0.0.0.0 --port 8000 --workers 1
    environment:
      HELIX_ENV: production
      HELIX_BASE_URL: ${HELIX_BASE_URL:-https://c7xai.in}
      HELIX_SECRET_KEY: ${HELIX_SECRET_KEY}
      DATABASE_URL: postgresql+psycopg2://helix:${POSTGRES_PASSWORD:-helix_change_me}@db:5432/helix
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-x-ai/grok-4.5}
      OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://c7xai.in}
      OPENROUTER_SITE_NAME: ${OPENROUTER_SITE_NAME:-Helix}
      APIFY_API_KEY: ${APIFY_API_KEY}
      APIFY_MAX_RESULTS_PER_SEARCH: ${APIFY_MAX_RESULTS_PER_SEARCH:-10}
      APIFY_DEDUPE_HOURS: ${APIFY_DEDUPE_HOURS:-48}
      APIFY_CACHE_HOURS: ${APIFY_CACHE_HOURS:-24}
      APIFY_FAIL_CLOSED: ${APIFY_FAIL_CLOSED:-true}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-Helix <noreply@c7xai.in>}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@c7xai.in}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      ALLOW_PUBLIC_SIGNUP: ${ALLOW_PUBLIC_SIGNUP:-true}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
      AUTO_CREATE_WORKSPACE_ON_SIGNUP: ${AUTO_CREATE_WORKSPACE_ON_SIGNUP:-true}
      DEFAULT_GOLD_TARGET_COUNT: ${DEFAULT_GOLD_TARGET_COUNT:-5000}
      DEFAULT_VARIATIONS_PER_GOLD: ${DEFAULT_VARIATIONS_PER_GOLD:-4}
      MAX_TOOL_ROUNDS: ${MAX_TOOL_ROUNDS:-12}
      # Security
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_AUTH_PER_MIN: ${RATE_LIMIT_AUTH_PER_MIN:-20}
      RATE_LIMIT_RIU_PER_MIN: ${RATE_LIMIT_RIU_PER_MIN:-30}
      TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-c7xai.in,www.c7xai.in,localhost,127.0.0.1,187.127.156.152}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      HEALTH_VERBOSE: ${HEALTH_VERBOSE:-false}
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-1048576}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - helix_data:/app/data

volumes:
  helix_pg:
  helix_data:
