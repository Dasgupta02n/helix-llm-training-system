# Helix reverse proxy — replace YOUR_DOMAIN with your custom domain.
# For TLS: place fullchain.pem + privkey.pem in deploy/certs/ (Let's Encrypt).

upstream helix_app {
    server app:8000;
}

# HTTP — redirect to HTTPS when certs are present; otherwise serve directly.
server {
    listen 80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # ACME challenge path for certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uncomment after certificates exist:
    # return 301 https://$host$request_uri;

    # Temporary plain HTTP (remove once TLS is on)
    location / {
        proxy_pass http://helix_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 25m;
    }
}

