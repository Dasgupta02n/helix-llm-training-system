<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Helix{% endblock %} — Training Data Studio</title>
  <meta name="description" content="{% block meta_description %}Helix is a no-code gold training-data studio for product and ops teams: plan in plain English, mine evidence, quality-gate gold examples, synthesize variants, and export fine-tune-ready datasets.{% endblock %}" />
  <link rel="stylesheet" href="/static/app.css?v={{ static_v }}" />
</head>
<body>
  <div class="landing-shell">
    <header class="landing-top">
      <a class="brand" href="/" style="display:flex;align-items:center;gap:11px;color:inherit;text-decoration:none">
        <div class="brand-mark">H</div>
        <div class="brand-text">
          <strong>Helix</strong>
          <span>Training data studio</span>
        </div>
      </a>
      <nav class="landing-nav flex" style="gap:10px;flex-wrap:wrap;align-items:center">
        <a class="btn btn-ghost btn-sm" href="/docs">Docs</a>
        <a class="btn btn-ghost btn-sm" href="/pricing">Pricing</a>
        <a class="btn btn-ghost btn-sm" href="/about">About</a>
        <a class="btn btn-secondary" href="/app">Open studio</a>
      </nav>
    </header>

    <main class="public-page">
      {% block content %}{% endblock %}
    </main>

    <footer class="public-footer">
      <div class="public-footer-inner">
        <div>
          <strong>Helix</strong> by c7x AI · Early beta · {{ version }}
        </div>
        <div class="public-footer-links">
          <a href="/privacy">Privacy</a>
          <a href="/terms">Terms</a>
          <a href="/security">Security</a>
          <a href="/pricing">Pricing</a>
          <a href="/docs">Docs</a>
          <a href="/about">About</a>
          <a href="/contact">Contact</a>
          <a href="/app">Studio</a>
        </div>
      </div>
    </footer>
  </div>
</body>
</html>
